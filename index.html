<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cybercafe PC Picker</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: #f7f8fa;
    color: #2b2f36;
    line-height: 1.5;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 32px 20px 60px; }
  header { margin-bottom: 28px; }
  header h1 { font-size: 1.6rem; font-weight: 600; letter-spacing: -0.01em; }
  header p { color: #6b7280; font-size: 0.95rem; margin-top: 4px; }

  section { margin-bottom: 32px; }
  h2 {
    font-size: 0.8rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #8a919c;
    margin-bottom: 12px;
  }

  .pc-list { display: flex; flex-direction: column; gap: 12px; }
  .pc-card {
    display: flex; align-items: center; justify-content: space-between;
    background: #ffffff;
    border: 2px solid #e5e8ec;
    border-radius: 12px;
    padding: 16px 18px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s, transform 0.1s;
    width: 100%;
    text-align: left;
    font: inherit;
    color: inherit;
  }
  .pc-card:hover { border-color: #b9c2cd; }
  .pc-card:focus-visible { outline: 3px solid #9db7d8; outline-offset: 2px; }
  .pc-card.selected {
    border-color: #3b82f6;
    background: #eef5ff;
  }
  .pc-name { font-weight: 600; font-size: 1.05rem; }
  .pc-spec { color: #6b7280; font-size: 0.85rem; margin-top: 2px; }
  .status {
    font-size: 0.8rem; font-weight: 600;
    padding: 4px 12px; border-radius: 999px; white-space: nowrap;
  }
  .status.available { background: #e6f5ec; color: #1e7a45; }
  .status.selected  { background: #dcecff; color: #1d5fbf; }

  .selected-panel {
    background: #ffffff;
    border: 2px solid #e5e8ec;
    border-radius: 12px;
    padding: 20px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
  }
  .selected-panel .none { color: #8a919c; }
  .selected-panel .chosen { font-weight: 600; font-size: 1.1rem; }
  .selected-panel .msg { color: #6b7280; font-size: 0.9rem; margin-top: 4px; }
  .clear-btn {
    background: #ffffff;
    border: 2px solid #d8dde4;
    border-radius: 10px;
    padding: 10px 18px;
    font: inherit;
    font-weight: 600;
    color: #2b2f36;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    white-space: nowrap;
  }
  .clear-btn:hover { border-color: #b9c2cd; background: #f2f4f7; }
  .clear-btn:disabled { opacity: 0.45; cursor: default; }

  .remaining-list { display: flex; flex-direction: column; gap: 10px; }
  .remaining-item {
    display: flex; align-items: center; justify-content: space-between;
    background: #ffffff;
    border: 1px solid #e5e8ec;
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 0.95rem;
  }
  .empty-note { color: #8a919c; font-size: 0.95rem; font-style: italic; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Cybercafe PC Picker</h1>
    <p>Pick a PC below. This demo runs entirely on this page — nothing is saved.</p>
  </header>

  <section id="section-list" aria-labelledby="h-list">
    <h2 id="h-list">All PCs</h2>
    <div class="pc-list" id="pcList"></div>
  </section>

  <section id="section-selected" aria-labelledby="h-selected">
    <h2 id="h-selected">Selected PC</h2>
    <div class="selected-panel" id="selectedPanel"></div>
  </section>

  <section id="section-remaining" aria-labelledby="h-remaining">
    <h2 id="h-remaining">Remaining Free PCs</h2>
    <div class="remaining-list" id="remainingList"></div>
  </section>
</div>

<script>
  var pcs = [
    { id: "pc1", name: "PC 01 — Merbau", spec: "RTX 4060 · 144Hz · curved monitor", available: true },
    { id: "pc2", name: "PC 02 — Cengal", spec: "RTX 3060 · 165Hz · gaming chair", available: true },
    { id: "pc3", name: "PC 03 — Kekatong", spec: "GTX 1660 Super · 1080p 144Hz", available: true }
  ];

  var pcList = document.getElementById("pcList");
  var selectedPanel = document.getElementById("selectedPanel");
  var remainingList = document.getElementById("remainingList");

  function render() {
    var selected = pcs.find(function(p) { return !p.available; });

    // Section 1: all PCs
    pcList.innerHTML = "";
    pcs.forEach(function(p) {
      var card = document.createElement("button");
      card.type = "button";
      card.className = "pc-card" + (p.available ? "" : " selected");
      card.setAttribute("aria-pressed", p.available ? "false" : "true");
      card.innerHTML =
        '<div><div class="pc-name">' + p.name + '</div>' +
        '<div class="pc-spec">' + p.spec + '</div></div>' +
        '<span class="status ' + (p.available ? "available" : "selected") + '">' +
        (p.available ? "Available" : "Selected") + '</span>';
      card.addEventListener("click", function() { selectPC(p.id); });
      pcList.appendChild(card);
    });

    // Section 2: selected PC
    selectedPanel.innerHTML = "";
    if (selected) {
      selectedPanel.innerHTML =
        '<div><div class="chosen">' + selected.name + '</div>' +
        '<div class="msg">Your choice — you can clear it any time.</div></div>';
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "clear-btn";
      btn.textContent = "Clear choice";
      btn.addEventListener("click", clearChoice);
      selectedPanel.appendChild(btn);
    } else {
      selectedPanel.innerHTML =
        '<div class="none">No PC chosen yet. Tap a PC above to pick one.</div>';
    }

    // Section 3: remaining free PCs
    remainingList.innerHTML = "";
    var free = pcs.filter(function(p) { return p.available; });
    if (free.length) {
      free.forEach(function(p) {
        var row = document.createElement("div");
        row.className = "remaining-item";
        row.innerHTML = "<span>" + p.name + "</span>" +
          '<span class="status available">Available</span>';
        remainingList.appendChild(row);
      });
    } else {
      remainingList.innerHTML = '<div class="empty-note">All PCs are taken in this demo — clear the choice to free them up.</div>';
    }
  }

  function selectPC(id) {
    pcs.forEach(function(p) { p.available = (p.id === id) ? false : true; });
    render();
  }

  function clearChoice() {
    pcs.forEach(function(p) { p.available = true; });
    render();
  }

  render();
</script>
</body>
</html>
